  cream_transparent: !color "#FFFDD080"
  lavender: !color "#E6E6FA"
  lavender_transparent: !color "#E6E6FA80"


uiStyles:
  darkMode:
    name: "Dark Mode"
    colors:
      'editor.filetree':
        bg: !color "_red"
        fg: !color "_red"
        file_tree:
          selected:
            fg: !color "_blue"
            bg: !color "_pink"
          non_selected:
            fg: !color "_red"
            bg: !color "_blue"

      'editor.texteditor.linenumbers':
        bg: !color "_red"
        fg: !color "_black"
        selection:
          text: !color "_black"
          color: !color "_red"

      #'editor.texteditor.infobar.col.text':
      #  bg: !color "_red"
      #'editor.texteditor.infobar.col.value':
      #  bg: !color "_red"
      #'editor.texteditor.infobar.line.value':
      #  bg: !color "_red"
      #'editor.texteditor.infobar.line.text':
      #  bg: !color "_red"

      'editor.texteditor':
        bg: !color "_gold"
        fg: !color "_red"
        border:
          style: "line"
          thickness: 10
          color: !color "_green"
        scroll:
          style: "simple"
          bg: !color "_gold"
          color: !color "#ffffffaa"
          increment: 8
        active_textarea:
          bg: !color "_blue"
          fg: !color "_black"
          cursor: !color "_red"
          selection:
            text: !color "_purple"
            color: !color "_red"
      'editor.texteditor.scrollpane':
        bg: !color "_red"

      'editor.texteditor.infobar':
        bg: !color "_red"
        item:
          bg: !color "_blue"

      '!^.+\.toolbar':
        bg: !color "_red"
      '!^.+\.toolbar\.buttons\.[^\.]+':
        bg: !color "_red"

      'editor.filetree.popupmenu':
        item:
          bg: !color "#00ff00"
          fg: !color "_red"
        border:
          style: "line"
          thickness: 10
          color: !color "#0000ff"


      '!^.+\.logpanel':
        bg: !color "_transparent"
        opaque: false
      '!^.+\.logpanel.text':
        bg: !color "_transparent"
        fg: !color "_transparent"
        opaque: false
      '!^.+\.logpanel.buffer':
        bg: !color "_red_transparent"
        opaque: false
        border: {}
      '!^.+\.logpanel.scroll':
        bg: !color "_transparent"
        fg: !color "_transparent"
        opaque: false
        border: {}
        scroll:
          style: "simple"
          bg: !color "_gold"
          color: !color "_blue"
          increment: 16
          viewport:
            opaque: false

      'simulation.panel':
        bg: !color "_transparent"
        opaque: false
      'simulation.panel.scroll':
        bg: !color "_transparent"
        opaque: false
        scroll:
          style: "simple"
          bg: !color "_gold"
          color: !color "_blue"
          increment: 16
          viewport:
            bg: !color "_red_transparent"
            opaque: true

      '!^.+\.splitplane':
        bg: !color "_transparent"
        opaque: false
        split:
          style: "simple"
          color: !color "_blue"
          hover: !color "_purple"
          handle: !color "_gold"

      'editor.menubar':
        bg: !color "_green"

      'modded.debugger':
        bg: !color "_darkGray"
        item:
          bg: !color "_gray"

      'modded.debugger.scroll':
        scroll:
          style: "simple"
          bg: !color "_gold"
          color: !color "#ffffffaa"
          increment: 8

      '!^.+\.debugger\.toolbar\.delay':
        bg: !color "_red"