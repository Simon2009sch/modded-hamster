  dark_mode_text: !color "#ffffff"
  dark_mode_select: !color "#214283aa"


uiStyles:
  darkMode:
    name: "Dark Mode"
    colors:
      # --- File Tree ---
      'editor.filetree':
        bg: !color "_dark_mode_2"
        fg: !color "_accent_text"
        file_tree:
          selected:
            fg: !color "_dark_mode_text"
            bg: !color "_dark_mode_select"
          non_selected:
            fg: !color "_dark_mode_text"
            bg: !color "_dark_mode_2"

      # --- Line Numbers ---
      'editor.texteditor.linenumbers':
        bg: !color "_dark_mode_2"
        fg: !color "#858585"
        selection:
          text: !color "#FFFFFF"
          color: !color "_accent_blue"

      # --- Text Editor Area ---
      'editor.texteditor':
        bg: !color "_dark_mode_1"
        border:
          style: "empty"
        scroll:
          style: "simple"
          bg: !color "_dark_mode_3"
          color: !color "_dark_mode_4"
          increment: 8
        active_textarea:
          bg: !color "_dark_mode_1"
          fg: !color "_white"
          cursor: !color "_white"
          selection:
            text: !color "_blue_light"
            color: !color "_dark_mode_select"

      # --- Scroll Pane ---
      'editor.texteditor.scrollpane':
        bg: !color "_dark_mode_1"

      # --- Info Bar ---
      'editor.texteditor.infobar':
        bg: !color "_dark_mode_3"
        item:
          bg: !color "_dark_mode_4"
          fg: !color "#DCDCDC"

      # --- Toolbars ---
      '!^.+\.toolbar':
        bg: !color "_dark_mode_4"
        fg: !color "_accent_text"
      '!^.+\.toolbar\.buttons\.[^\.]+':
        bg: !color "_dark_mode_3"
        fg: !color "#FFFFFF"

      # --- Popup Menus ---
      'editor.filetree.popupmenu':
        item:
          bg: !color "_dark_mode_4"
          fg: !color "#EAEAEA"
        border:
          style: "line"
          thickness: 1
          color: !color "_accent_border"

      # --- Log Panels ---
      '!^.+\.logpanel':
        bg: !color "_dark_mode_3"
        opaque: true
      '!^.+\.logpanel.text':
        bg: !color "_dark_mode_3"
        fg: !color "#BEBEBE"
        opaque: true
      '!^.+\.logpanel.buffer':
        bg: !color "#1E1E1E80"
        opaque: true
      '!^.+\.logpanel.scroll':
        bg: !color "_dark_mode_3"
        fg: !color "#666666"
        opaque: true
        scroll:
          style: "simple"
          bg: !color "_dark_mode_4"
          color: !color "_accent_blue"
          increment: 16
          viewport:
            opaque: true

      # --- Simulation Panel ---
      'simulation.panel':
        bg: !color "_dark_mode_1"
        opaque: true
      'simulation.panel.scroll':
        bg: !color "_dark_mode_1"
        opaque: true
        scroll:
          style: "simple"
          bg: !color "_dark_mode_4"
          color: !color "_accent_blue"
          increment: 16
          viewport:
            bg: !color "#00000000"
            opaque: true

      # --- Split Panels ---
      '!^.+\.splitplane':
        bg: !color "_dark_mode_2"
        opaque: true
        split:
          style: "simple"
          color: !color "_dark_mode_2"
          hover: !color "_dark_mode_3"
          handle: !color "_dark_mode_4"

      # --- Menu Bar ---
      'editor.menubar':
        bg: !color "_dark_mode_3"
        fg: !color "#FFFFFF"
        item:
          fg: !color "_dark_mode_5"

      # --- Debugger ---
      'modded.debugger':
        bg: !color "_dark_mode_2"
        item:
          bg: !color "_dark_mode_4"
          fg: !color "_accent_text"

      'modded.debugger.scroll':
        scroll:
          style: "simple"
          bg: !color "_dark_mode_4"
          color: !color "_dark_mode_3"
          increment: 8

      '!^.+\.debugger\.toolbar\.delay':
        bg: !color "_dark_mode_3"