presetColors:
  black: !color "#000000"
  white: !color "#ffffff"
  darkGray: !color "#333333"
  gray: !color "#666666"
  lightGray: !color "#999999"
  dark_white: !color "100100100"
  blue: !color "0 0 255"
  red: !color "#ff0000"



uiStyles:
  darkMode:
    name: "Dark Mode"
    colors:
      'editor.filetree':
        bg: !color "_red"
        fg: !color "_red"

      'editor.texteditor.linenumbers':
        bg: !color "_red"
        fg: !color "_red"
      'editor.texteditor.linenumbers.selection':
        bg: !color "_red"
        fg: !color "_red"

      'editor.texteditor.infobar.col.text':
        bg: !color "_red"
      'editor.texteditor.infobar.col.value':
        bg: !color "_red"
      'editor.texteditor.infobar.line.value':
        bg: !color "_red"
      'editor.texteditor.infobar.line.text':
        bg: !color "_red"

      'editor.texteditor':
        bg: !color "_red"
        fg: !color "_red"
      'editor.texteditor.textarea':
        bg.active: !color "_red"
        locked:
          bg: !color "_red"
        unlocked:
          bg: !color "_red"
      'editor.texteditor.scrollpane':
        bg: !color "_red"

      'editor.texteditor.infobar':
        bg: !color "_red"
        update_button:
          text: !color "_red"
          action: !color "_red"

      '!^.+\.toolbar':
        bg: !color "_red"
      '!^.+\.toolbar\.buttons\.[^\.]+':
        bg: !color "_red"

      'editor.filetree.popupmenu':
        item:
          bg: !color "_red"
          fg: !color "_red"
        border:
          style: "line"
          th: 5
          color: !color "_red"

      'test.123': !color "_red"

      '!^.+\.logpanel':
        bg: !color "_red"
      '!^.+\.logpanel.text':
        bg: !color "_red"
        fg: !color "_red"

      'simulation.panel':
        bg: !color "_red"
      'simulation.panel.scroll':
        bg: !color "_red"
        vscroll:
          ui: !color "_red"
        hscroll:
          ui: !color "_red"

      '!^.+\.splitplane':
        ui: !color "_red"

      'editor.menubar':
        bg: !color "_red"

      '!^.+\.debugger\.toolbar\.delay':
        ui: !color "_red"
        bg: !color "_red"